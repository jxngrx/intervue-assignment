services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poll-backend
    ports:
      - "3005:3005"
    # depends_on:
    #   - mongo
    restart: unless-stopped
    networks:
      - poll-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poll-frontend
    ports:
      - "5173:5173"
    # depends_on:
    #   - mongo
    restart: unless-stopped
    networks:
      - poll-network

  # mongo:
  #   image: mongo:7
  #   container_name: poll-mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped
  #   networks:
  #     - poll-network

volumes:
  mongo-data:

networks:
  poll-network:
    driver: bridge
