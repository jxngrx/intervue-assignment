version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poll-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/polling-system
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - poll-network

  mongo:
    image: mongo:7
    container_name: poll-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - poll-network

volumes:
  mongo-data:

networks:
  poll-network:
    driver: bridge
